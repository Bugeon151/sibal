name = "suhaengcut-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# 쉼표로 구분. 프론트 배포 주소가 정해지면 추가한다.
ALLOWED_ORIGINS = "https://parkbugeon-bit.github.io,http://localhost:5173"
RATE_PER_MINUTE = "30"

# 비밀 값은 여기에 쓰지 않는다. 아래 명령으로 등록:
#   npx wrangler secret put KCI_API_KEY
#   npx wrangler secret put OPENALEX_API_KEY
#   npx wrangler secret put NAVER_CLIENT_ID
#   npx wrangler secret put NAVER_CLIENT_SECRET
# 로컬 개발용은 .dev.vars 파일 (git에 올리지 않음)
