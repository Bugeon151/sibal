name: 중계 함수 배포 (Cloudflare Workers)

# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  — 없으면 이 작업은 건너뛴다
#   KCI_API_KEY, OPENALEX_API_KEY, NAVER_CLIENT_ID, NAVER_CLIENT_SECRET — 중계 함수의 비밀 값으로 등록된다
# 허용 출처(ALLOWED_ORIGINS)는 packages/relay/wrangler.toml에서 관리한다.

on:
  push:
    branches: [main]
    paths: ['packages/relay/**', '.github/workflows/relay.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cloudflare 토큰 확인
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN이 없어 배포를 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
      - name: 배포
        if: steps.check.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/relay
          secrets: |
            KCI_API_KEY
            OPENALEX_API_KEY
            NAVER_CLIENT_ID
            NAVER_CLIENT_SECRET
        env:
          KCI_API_KEY: ${{ secrets.KCI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
